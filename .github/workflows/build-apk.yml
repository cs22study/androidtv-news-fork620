name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Persistent Keystore
        run: |
          if [ ! -f "keystore.jks" ]; then
            echo "Error: keystore.jks not found!"
            exit 1
          fi
          echo "Persistent keystore.jks found and verified."

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Release APKs (Multi-Architecture & Universal)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_build.log || {
            BUILD_CODE=$?
            echo "### ❌ Gradle Build Failed (Exit Code: $BUILD_CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_CODE
          }

      - name: Report Build Log via Commit Comment
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const log = fs.existsSync("gradle_build.log") ? fs.readFileSync("gradle_build.log", "utf8") : "no log";
            const lines = log.split("\n").slice(-80).join("\n");
            const body = JSON.stringify({ body: "### ❌ Gradle Build Failure Log:\n```text\n" + lines + "\n```" });
            const token = process.env.GITHUB_TOKEN;
            const repo = process.env.GITHUB_REPOSITORY;
            const sha = process.env.GITHUB_SHA;
            const url = "https://api.github.com/repos/" + repo + "/commits/" + sha + "/comments";
            const req = require("https").request(url, {
              method: "POST",
              headers: {
                "Authorization": "token " + token,
                "Content-Type": "application/json",
                "User-Agent": "Build-Reporter"
              }
            }, (res) => {
              console.log("Comment status:", res.statusCode);
            });
            req.write(body);
            req.end();
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Outputs
        run: |
          mkdir -p release_apk
          echo "Scanning generated release APKs:"
          find app/build/outputs/apk/release/ -name "*.apk"
          
          # Copy universal APK
          find app/build/outputs/apk/release/ -name "*universal*.apk" -exec cp {} release_apk/androidtv-news-fork620-universal-release.apk \; || true
          
          # Copy 32-bit armeabi-v7a APK (for OPPO R11s Plus / Xiaomi Box S)
          find app/build/outputs/apk/release/ -name "*armeabi-v7a*.apk" -exec cp {} release_apk/androidtv-news-fork620-armeabi-v7a-release.apk \; || true
          
          # Copy 64-bit arm64-v8a APK (for modern OPPO phones / 64-bit devices)
          find app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" -exec cp {} release_apk/androidtv-news-fork620-arm64-v8a-release.apk \; || true
          
          # Fallback if universal wasn't captured
          if [ ! -f release_apk/androidtv-news-fork620-universal-release.apk ]; then
            find app/build/outputs/apk/release/ -name "*.apk" | head -n 1 | xargs -I {} cp {} release_apk/androidtv-news-fork620-universal-release.apk
          fi

          echo "Final APK deliverables:"
          ls -lh release_apk/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: androidtv-news-fork620-apks
          path: |
            release_apk/*.apk
            gradle_build.log
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v6.2.3
          name: 新聞直播 fork620 APP v6.2.3 正式版 (直屏自適應比例防變形/YouTube緩衝流暢度優化)
          body: |
            ## 📺 新聞直播 fork620 APP v6.2.3 - 多設備多架構相容安裝包

            本版本特別針對使用者實測回饋進行深入調校，完美解決直屏短劇橫向變形拉伸，以及 YouTube 非直播流行音樂/點播影片播放數秒後卡頓緩衝的問題：

            ---
            ### 📥 設備安裝對照表與下載推薦：

            | 設備類型 | 設備代表範例 | 推薦下載檔案 | 下載連結 | 說明 |
            | :--- | :--- | :--- | :--- | :--- |
            | 🌟 **全設備通用 (首選推薦)** | 小米盒子 S、各種手機、電腦模擬器 | **通用版 (Universal)** | 👉 [androidtv-news-fork620-universal-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.3/androidtv-news-fork620-universal-release.apk) | 內建 32/64 雙架構，相容度最高 |
            | 📱 **舊款手機 / 32位元電視** | **OPPO R11s Plus (Android 7.1.1)**、32位元小米盒子 | **32位元相容版 (armeabi-v7a)** | 👉 [androidtv-news-fork620-armeabi-v7a-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.3/androidtv-news-fork620-armeabi-v7a-release.apk) | 解決 ColorOS 擋除錯版與舊系統解析問題 |
            | 🚀 **新版旗艦手機** | **OPPO 新版手機 (Android 12~15)**、64位元電視 | **64位元高速版 (arm64-v8a)** | 👉 [androidtv-news-fork620-arm64-v8a-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.3/androidtv-news-fork620-arm64-v8a-release.apk) | 純 64 位元優化，運行速度更快體積更小 |
            | 💻 **電腦 Android 模擬器** | 雷電 / 夜神 / BlueStacks / MuMu | **通用版 (Universal)** | 👉 [androidtv-news-fork620-universal-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.3/androidtv-news-fork620-universal-release.apk) | 支援模擬器 x86/ARM 二進制翻譯器 |

            ---
            ### ✨ v6.2.3 重大修復與更新項目：
            1. **🎬 直屏短劇與 Shorts 自適應比例防變形 (Auto-Fit 9:16 / 16:9)**：
               - 解決直屏短劇被橫向強制拉伸的問題。ExoPlayer 監聽 `onVideoSizeChanged` 動態計算真實寬高比，預設以最佳比例居中呈現，兩側提供純黑背景。
               - 支援三段式畫面比例切換（Fit 保持原比 / Stretch 全螢幕拉伸 / Crop 裁切填滿），可由左側選單、遙控器或 Web 後台隨時切換並持久化記憶。
            2. **⚡ YouTube 流行音樂與點播影片 (VOD) 播放流暢度優化**：
               - 調校 ExoPlayer `DefaultLoadControl`（起播緩衝優化至 1.0 秒以加速啟動，二次緩衝優化至 2.5 秒，避免長時間轉圈等候）。
               - 優化 `MergingMediaSource` 開啟影音軌時間戳偏移與長度修剪 (`adjustPeriodTimeOffsets=true, clipDurations=true`)，消除音訊分離軌同步停滯。
               - 設定 `DefaultHttpDataSource` 寬容逾時與 Chrome Desktop 標頭，並將預設 YouTube 畫質優化為 `bv*[height<=1080]+ba/b`，避免電視盒拉取 4K 導致頻寬擁塞與解碼卡頓。
            3. **🎯 繼承 v6.2.2 所有核心功能**：
               - 小米盒子 S 頻道總表三重點擊選台。
               - YouTube 關鍵字搜尋歷史 CSV 持久化與快捷按鈕。
               - 左側選單直覺「🚪 退出 APP」。
               - 頻道自定義四重備份與 Web 端一鍵 JSON 匯出/匯入。
          draft: false
          prerelease: false
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
