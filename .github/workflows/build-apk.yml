name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate Official Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias fork620 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fork620password \
            -keypass fork620password \
            -dname "CN=NewsLiveFork620, OU=cs22study, O=cs22study, L=Taipei, ST=Taiwan, C=TW"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Release APKs (Multi-Architecture & Universal)
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p release_apk
          echo "Scanning generated release APKs:"
          find app/build/outputs/apk/release/ -name "*.apk"
          
          # Copy universal APK
          find app/build/outputs/apk/release/ -name "*universal*.apk" -exec cp {} release_apk/androidtv-news-fork620-universal-release.apk \; || true
          
          # Copy 32-bit armeabi-v7a APK (for OPPO R11s Plus / Xiaomi Box S)
          find app/build/outputs/apk/release/ -name "*armeabi-v7a*.apk" -exec cp {} release_apk/androidtv-news-fork620-armeabi-v7a-release.apk \; || true
          
          # Copy 64-bit arm64-v8a APK (for modern OPPO phones / 64-bit devices)
          find app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" -exec cp {} release_apk/androidtv-news-fork620-arm64-v8a-release.apk \; || true
          
          # Fallback if universal wasn't captured
          if [ ! -f release_apk/androidtv-news-fork620-universal-release.apk ]; then
            find app/build/outputs/apk/release/ -name "*.apk" | head -n 1 | xargs -I {} cp {} release_apk/androidtv-news-fork620-universal-release.apk
          fi

          echo "Final APK deliverables:"
          ls -lh release_apk/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: androidtv-news-fork620-apks
          path: release_apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.2.0-preview
          name: 新聞直播 fork620 多架構相容正式版 (v6.2.0-preview)
          body: |
            ## 📺 新聞直播 fork620 APP - 多設備多架構相容安裝包

            本版本特別針對不同裝置環境（舊款手機、新款手機、電視盒、電腦模擬器）完成專屬簽名與架構分包，全面解決安裝報錯問題：

            ---
            ### 📥 設備安裝對照表與下載推薦：

            | 設備類型 | 設備代表範例 | 推薦下載檔案 | 下載連結 | 說明 |
            | :--- | :--- | :--- | :--- | :--- |
            | 🌟 **全設備通用 (首選推薦)** | 小米盒子 S、各種手機、電腦模擬器 | **通用版 (Universal)** | 👉 [androidtv-news-fork620-universal-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.0-preview/androidtv-news-fork620-universal-release.apk) | 內建 32/64 雙架構，相容度最高 |
            | 📱 **舊款手機 / 32位元電視** | **OPPO R11s Plus (Android 7.1.1)**、32位元小米盒子 | **32位元相容版 (armeabi-v7a)** | 👉 [androidtv-news-fork620-armeabi-v7a-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.0-preview/androidtv-news-fork620-armeabi-v7a-release.apk) | 解決 ColorOS 擋除錯版與舊系統解析問題 |
            | 🚀 **新版旗艦手機** | **OPPO 新版手機 (Android 12~15)**、64位元電視 | **64位元高速版 (arm64-v8a)** | 👉 [androidtv-news-fork620-arm64-v8a-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.0-preview/androidtv-news-fork620-arm64-v8a-release.apk) | 純 64 位元優化，運行速度更快體積更小 |
            | 💻 **電腦 Android 模擬器** | 雷電 / 夜神 / BlueStacks / MuMu | **通用版 (Universal)** | 👉 [androidtv-news-fork620-universal-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.0-preview/androidtv-news-fork620-universal-release.apk) | 支援模擬器 x86/ARM 二進制翻譯器 |

            ---
            ### 🛠️ OPPO R11s Plus (Android 7.1.1) 安裝問題修復說明：
            1. **解除除錯版阻擋**：先前提供之 APK 帶有除錯旗標 (`debuggable=true`) 與 `Android Debug` 證書，遭 OPPO ColorOS 內建安全機制主動攔截阻止安裝。
            2. **完整雙簽名機制**：全面導入正式 Release 簽名，並同時啟用 **V1 (JAR 簽署)** 與 **V2 (APK 簽名方案)**，完美通過 ColorOS 3.2 與 Android 7.1.1 軟體校驗。
            3. **關閉 R8 混淆風險**：避免舊款 ART 虛擬機載入最佳化字節碼時發生 Verification Error。

            ---
            ### ✨ 本次更新功能：
            1. **🌐 TVBox 風格區網遠端管理後台 (`LocalWebServer`)**：手機或電腦瀏覽器輸入 `http://[電視IP]:8080` 即刻管理頻道、上傳 `config.txt`、貼上 `cookies.txt` 與使用虛擬遙控器。
            2. **🎨 現代化左側選單美化**：深色壓克力磨砂邊欄、字體調校至 `16sp`、焦點高對比光暈。
          draft: false
          prerelease: false
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
