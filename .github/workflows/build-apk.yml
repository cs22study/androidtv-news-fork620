name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Persistent Keystore
        run: |
          if [ ! -f "keystore.jks" ]; then
            echo "Error: keystore.jks not found!"
            exit 1
          fi
          echo "Persistent keystore.jks found and verified."

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Release APKs (Multi-Architecture & Universal)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_build.log || {
            BUILD_CODE=$?
            echo "### ❌ Gradle Build Failed (Exit Code: $BUILD_CODE)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $BUILD_CODE
          }

      - name: Report Build Log via Commit Comment
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const log = fs.existsSync("gradle_build.log") ? fs.readFileSync("gradle_build.log", "utf8") : "no log";
            const lines = log.split("\n").slice(-80).join("\n");
            const body = JSON.stringify({ body: "### ❌ Gradle Build Failure Log:\n```text\n" + lines + "\n```" });
            const token = process.env.GITHUB_TOKEN;
            const repo = process.env.GITHUB_REPOSITORY;
            const sha = process.env.GITHUB_SHA;
            const url = "https://api.github.com/repos/" + repo + "/commits/" + sha + "/comments";
            const req = require("https").request(url, {
              method: "POST",
              headers: {
                "Authorization": "token " + token,
                "Content-Type": "application/json",
                "User-Agent": "Build-Reporter"
              }
            }, (res) => {
              console.log("Comment status:", res.statusCode);
            });
            req.write(body);
            req.end();
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Outputs
        run: |
          mkdir -p release_apk
          echo "Scanning generated release APKs:"
          find app/build/outputs/apk/release/ -name "*.apk"
          
          # Copy universal APK
          find app/build/outputs/apk/release/ -name "*universal*.apk" -exec cp {} release_apk/androidtv-news-fork620-universal-release.apk \; || true
          
          # Copy 32-bit armeabi-v7a APK (for OPPO R11s Plus / Xiaomi Box S)
          find app/build/outputs/apk/release/ -name "*armeabi-v7a*.apk" -exec cp {} release_apk/androidtv-news-fork620-armeabi-v7a-release.apk \; || true
          
          # Copy 64-bit arm64-v8a APK (for modern OPPO phones / 64-bit devices)
          find app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" -exec cp {} release_apk/androidtv-news-fork620-arm64-v8a-release.apk \; || true
          
          # Fallback if universal wasn't captured
          if [ ! -f release_apk/androidtv-news-fork620-universal-release.apk ]; then
            find app/build/outputs/apk/release/ -name "*.apk" | head -n 1 | xargs -I {} cp {} release_apk/androidtv-news-fork620-universal-release.apk
          fi

          echo "Final APK deliverables:"
          ls -lh release_apk/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: androidtv-news-fork620-apks
          path: |
            release_apk/*.apk
            gradle_build.log
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v6.2.4
          name: 新聞直播 Fork620 APP v6.2.4 正式版 (獨立包名雙軌並存/獨立簽名/專屬自動更新通道)
          body: |
            ## 📺 新聞直播 Fork620 APP v6.2.4 - 多設備多架構相容安裝包

            本版本特別針對使用者實測回饋進行架構升級，為 Fork 修改版建立全新專屬識別體系，讓**原版新聞直播與 Fork620 修改版可 100% 在同一台設備上並存運行**，各自獨立更新互不衝突：

            ---
            ### 📥 設備安裝對照表與下載推薦：

            | 設備類型 | 設備代表範例 | 推薦下載檔案 | 下載連結 | 說明 |
            | :--- | :--- | :--- | :--- | :--- |
            | 🌟 **全設備通用 (首選推薦)** | 小米盒子 S、各種手機、電腦模擬器 | **通用版 (Universal)** | 👉 [androidtv-news-fork620-universal-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.4/androidtv-news-fork620-universal-release.apk) | 內建 32/64 雙架構，相容度最高 |
            | 📱 **舊款手機 / 32位元電視** | **OPPO R11s Plus (Android 7.1.1)**、32位元小米盒子 | **32位元相容版 (armeabi-v7a)** | 👉 [androidtv-news-fork620-armeabi-v7a-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.4/androidtv-news-fork620-armeabi-v7a-release.apk) | 解決 ColorOS 擋除錯版與舊系統解析問題 |
            | 🚀 **新版旗艦手機** | **OPPO 新版手機 (Android 12~15)**、64位元電視 | **64位元高速版 (arm64-v8a)** | 👉 [androidtv-news-fork620-arm64-v8a-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.4/androidtv-news-fork620-arm64-v8a-release.apk) | 純 64 位元優化，運行速度更快體積更小 |
            | 💻 **電腦 Android 模擬器** | 雷電 / 夜神 / BlueStacks / MuMu | **通用版 (Universal)** | 👉 [androidtv-news-fork620-universal-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.4/androidtv-news-fork620-universal-release.apk) | 支援模擬器 x86/ARM 二進制翻譯器 |

            ---
            ### ✨ v6.2.4 重大升級與獨立體系特色：
            1. **🆔 專屬獨立 Application ID (`io.github.cs22study.newsfork620`)**：
               - 徹底解決原版與修改版在小米盒子及手機上「無法同時安裝」與「簽名衝突」問題。
               - 與原版「新聞直播」完全獨立隔離，雙 App 可同時安裝在同一台電視盒或手機上並存運行！
            2. **🏷️ 專屬 APP 名稱「新聞直播 Fork620」**：
               - 桌面圖示、側邊選單與 Web 管理後台皆清楚標記為「新聞直播 Fork620」，視覺一目了然不再混淆。
            3. **🔄 專屬自動與手動更新通道**：
               - 原版新聞直播 App 走原作者的更新通道；本版走 Fork620 專屬 GitHub Releases 更新通道，兩者互不干擾。
            4. **🔄 原版頻道與偏好無縫轉移機制**：
               - 全新安裝 Fork620 時，系統自動偵測並繼承原版 `config.txt`、`custom.txt` 與搜尋歷史，原有辛苦建立的頻道 100% 零痛轉移！
            5. **🎬 包含 v6.2.3 之所有特性**：
               - 直屏短劇 9:16 自適應居中防拉伸 (Fit/Stretch/Crop)。
               - YouTube 流行音樂與點播影片緩衝調校 (1.0s 秒開 / 2.5s 重緩衝 / 1080p 畫質上限)。
          draft: false
          prerelease: false
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
