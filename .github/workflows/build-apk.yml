name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify Persistent Keystore
        run: |
          if [ ! -f "keystore.jks" ]; then
            echo "Error: keystore.jks not found!"
            exit 1
          fi
          echo "Persistent keystore.jks found and verified."

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Release APKs (Multi-Architecture & Universal)
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p release_apk
          echo "Scanning generated release APKs:"
          find app/build/outputs/apk/release/ -name "*.apk"
          
          # Copy universal APK
          find app/build/outputs/apk/release/ -name "*universal*.apk" -exec cp {} release_apk/androidtv-news-fork620-universal-release.apk \; || true
          
          # Copy 32-bit armeabi-v7a APK (for OPPO R11s Plus / Xiaomi Box S)
          find app/build/outputs/apk/release/ -name "*armeabi-v7a*.apk" -exec cp {} release_apk/androidtv-news-fork620-armeabi-v7a-release.apk \; || true
          
          # Copy 64-bit arm64-v8a APK (for modern OPPO phones / 64-bit devices)
          find app/build/outputs/apk/release/ -name "*arm64-v8a*.apk" -exec cp {} release_apk/androidtv-news-fork620-arm64-v8a-release.apk \; || true
          
          # Fallback if universal wasn't captured
          if [ ! -f release_apk/androidtv-news-fork620-universal-release.apk ]; then
            find app/build/outputs/apk/release/ -name "*.apk" | head -n 1 | xargs -I {} cp {} release_apk/androidtv-news-fork620-universal-release.apk
          fi

          echo "Final APK deliverables:"
          ls -lh release_apk/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: androidtv-news-fork620-apks
          path: release_apk/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.2.2
          name: 新聞直播 fork620 APP v6.2.2 正式版 (頻道選台修復/搜尋歷史CSV/退出APP功能)
          body: |
            ## 📺 新聞直播 fork620 APP v6.2.2 - 多設備多架構相容安裝包

            本版本特別針對電視盒（小米盒子 S 3代、Google TV）、手機與電腦模擬器進行關鍵修復與體驗升級：

            ---
            ### 📥 設備安裝對照表與下載推薦：

            | 設備類型 | 設備代表範例 | 推薦下載檔案 | 下載連結 | 說明 |
            | :--- | :--- | :--- | :--- | :--- |
            | 🌟 **全設備通用 (首選推薦)** | 小米盒子 S、各種手機、電腦模擬器 | **通用版 (Universal)** | 👉 [androidtv-news-fork620-universal-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.2/androidtv-news-fork620-universal-release.apk) | 內建 32/64 雙架構，相容度最高 |
            | 📱 **舊款手機 / 32位元電視** | **OPPO R11s Plus (Android 7.1.1)**、32位元小米盒子 | **32位元相容版 (armeabi-v7a)** | 👉 [androidtv-news-fork620-armeabi-v7a-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.2/androidtv-news-fork620-armeabi-v7a-release.apk) | 解決 ColorOS 擋除錯版與舊系統解析問題 |
            | 🚀 **新版旗艦手機** | **OPPO 新版手機 (Android 12~15)**、64位元電視 | **64位元高速版 (arm64-v8a)** | 👉 [androidtv-news-fork620-arm64-v8a-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.2/androidtv-news-fork620-arm64-v8a-release.apk) | 純 64 位元優化，運行速度更快體積更小 |
            | 💻 **電腦 Android 模擬器** | 雷電 / 夜神 / BlueStacks / MuMu | **通用版 (Universal)** | 👉 [androidtv-news-fork620-universal-release.apk](https://github.com/cs22study/androidtv-news-fork620/releases/download/v6.2.2/androidtv-news-fork620-universal-release.apk) | 支援模擬器 x86/ARM 二進制翻譯器 |

            ---
            ### ✨ v6.2.2 重大修復與更新項目：
            1. **🎯 徹底修復「頻道總覽無法選台」問題 (小米盒子 S 3代實機驗證)**：
               - 解決 `ListView` 內部子項焦點衝突問題，建立實體遙控器 `DPAD_CENTER` / `ENTER`、`OnItemClickListener` 與子項點擊三重安全觸發機制，保證遙控器按 OK 立即跳轉指定頻道。
            2. **📜 YouTube 搜尋歷史紀錄 (CSV 持久化儲存)**：
               - 新增搜尋關鍵字自動記錄至 `youtube_search_history.csv`，內建「機場直播」、「流行音樂」、「穿越短劇」等預設關鍵字。
               - 電視搜尋視窗與 Web 管理後台同步提供一秒快速點選標籤，免去遙控器繁瑣注音/英文輸入。
            3. **🚪 左側選單新增「退出 APP」按鈕**：
               - 左側選單最下方提供直覺的「🚪 退出 APP」功能鍵，點擊直接完全退出 APP，不再彈出二次確認視窗。
            4. **💾 頻道資料四重持久化防護**：
               - 建立外部儲存、內部私有目錄 (`/data/user/0/...`)、系統級 SharedPreferences 與滾動備份檔，保證版本更新升級自建頻道零遺失。
            5. **🌐 TVBox 網頁管理後台一鍵匯出/匯入備份**：
               - 電腦或手機瀏覽器一鍵下載 `news_channels_backup.json` 或上傳備份檔快速還原。
          draft: false
          prerelease: false
          files: release_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
